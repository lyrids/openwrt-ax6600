<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 990" role="img" aria-labelledby="t d"><title id="t">DUT-centric lab topology</title><desc id="d">Solid test links connect DUT LAN1 to p43 eth0, LAN2 to p42 eth0, LAN4 to wrt LAN1. QCN station connects wirelessly to the Wi-Fi test router. m4 wlan0 is a Wi-Fi test client and end0 is its dedicated management interface. Dotted management connections terminate at dedicated host Ethernet interfaces.</desc><rect width="1400" height="990" rx="14" fill="#f5f8ef"/><g font-family="system-ui,sans-serif"><path d="M145 575V390H365" fill="none" stroke="#9373af" stroke-width="3" stroke-dasharray="8 5"/><text x="35" y="420" font-size="13" fill="#7a5896">p41 wlan0 → DUT 5GHz AP</text><text x="35" y="35" font-size="13" fill="#45623e">AX6600 LAB · DUT AND PAYLOAD PATHS</text><path d="M145 825H1380" fill="none" stroke="#8c9fa7" stroke-width="2" stroke-dasharray="2 7"/><path d="M145 755V825" fill="none" stroke="#8c9fa7" stroke-width="2" stroke-dasharray="2 7"/><path d="M435 755V825" fill="none" stroke="#8c9fa7" stroke-width="2" stroke-dasharray="2 7"/><path d="M735 755V825" fill="none" stroke="#8c9fa7" stroke-width="2" stroke-dasharray="2 7"/><path d="M1085 755V825" fill="none" stroke="#8c9fa7" stroke-width="2" stroke-dasharray="2 7"/><path d="M1380 825V465H835" fill="none" stroke="#8c9fa7" stroke-width="2" stroke-dasharray="2 7"/><path d="M390 545V435H485" fill="none" stroke="#547e43" stroke-width="3" stroke-dasharray=""/><path d="M690 545V500H640" fill="none" stroke="#547e43" stroke-width="3" stroke-dasharray=""/><path d="M1030 545V435H835" fill="none" stroke="#547e43" stroke-width="3" stroke-dasharray=""/><path d="M835 330H1010" fill="none" stroke="#9373af" stroke-width="3" stroke-dasharray="8 5"/><path d="M640 290V180H1010" fill="none" stroke="#8b72ac" stroke-width="3" stroke-dasharray="8 5"/><rect x="365" y="290" width="470" height="210" rx="10" fill="#dcebd4" stroke="#abc3a5"/><text x="381" y="319" font-size="19" font-weight="700" fill="#214636">DUT · AX6600</text><text x="381" y="346" font-size="13" fill="#496657">Image14 RAM / Image12 eMMC · LAN node-04</text><text x="381" y="368" font-size="13" fill="#496657">LAN1 → p43   |   LAN2 → p42</text><text x="381" y="390" font-size="13" fill="#496657">LAN4 / wiredtest: node-05</text><text x="381" y="412" font-size="13" fill="#496657">QCN STA: node-06 · HE160</text><text x="381" y="434" font-size="13" fill="#496657">WAN: node-07 · China IPv4 policy</text><text x="381" y="456" font-size="13" fill="#496657">wg-test: node-08</text><rect x="1010" y="250" width="350" height="165" rx="10" fill="#e9e2f1" stroke="#abc3a5"/><text x="1026" y="279" font-size="19" font-weight="700" fill="#214636">Wi-Fi router / test server</text><text x="1026" y="306" font-size="13" fill="#496657">node-09 · LAB-UPLINK</text><text x="1026" y="328" font-size="13" fill="#496657">QCN link ch64 / HE160</text><text x="1026" y="350" font-size="13" fill="#496657">iperf3 TCP/UDP 5201 / 5202</text><text x="1026" y="372" font-size="13" fill="#496657">Exact radio part not inventoried</text><rect x="1010" y="70" width="350" height="125" rx="10" fill="#e9e2f1" stroke="#abc3a5"/><text x="1026" y="99" font-size="19" font-weight="700" fill="#214636">Remote WireGuard server</text><text x="1026" y="126" font-size="13" fill="#496657">Tunnel-side test host node-10</text><text x="1026" y="148" font-size="13" fill="#496657">Encrypted tunnel via DUT WAN</text><text x="1026" y="170" font-size="13" fill="#496657">Other public IPv4 · VPN table100</text><text x="850" y="315" font-size="13" fill="#7a5896">QCN9074 Wi-Fi</text><text x="650" y="165" font-size="13" fill="#7a5896">VPN · logical path via WAN / Internet</text><rect x="30" y="575" width="230" height="180" rx="10" fill="#e5eedf" stroke="#abc3a5"/><text x="46" y="604" font-size="19" font-weight="700" fill="#214636">p41</text><text x="46" y="631" font-size="13" fill="#496657">Management: node-11</text><text x="46" y="653" font-size="13" fill="#496657">Pi4 Rev1.4 · brcmfmac VHT1×1</text><text x="46" y="675" font-size="13" fill="#496657">wlan0 [node] · ch149 / 80MHz</text><rect x="300" y="545" width="270" height="210" rx="10" fill="#e5eedf" stroke="#abc3a5"/><text x="316" y="574" font-size="19" font-weight="700" fill="#214636">p43 · boot / test server</text><text x="316" y="601" font-size="13" fill="#496657">TEST eth0: node-12</text><text x="316" y="623" font-size="13" fill="#496657">Boot/netconsole: node-13</text><text x="316" y="645" font-size="13" fill="#496657">WLAN wlan0: down at baseline</text><text x="316" y="667" font-size="13" fill="#496657">Raspberry Pi 4 onboard WLAN</text><text x="316" y="689" font-size="13" fill="#496657">MGMT eth1: node-14</text><rect x="600" y="545" width="270" height="210" rx="10" fill="#e5eedf" stroke="#abc3a5"/><text x="616" y="574" font-size="19" font-weight="700" fill="#214636">p42 · test server</text><text x="616" y="601" font-size="13" fill="#496657">TEST eth0: node-15</text><text x="616" y="623" font-size="13" fill="#496657">WLAN wlan0: managed / historical</text><text x="616" y="645" font-size="13" fill="#496657">Pi 4 onboard WLAN / brcmfmac</text><text x="616" y="667" font-size="13" fill="#496657">MGMT eth1: node-16</text><rect x="900" y="545" width="370" height="210" rx="10" fill="#e5eedf" stroke="#abc3a5"/><text x="916" y="574" font-size="19" font-weight="700" fill="#214636">wrt · test peer</text><text x="916" y="601" font-size="13" fill="#496657">TEST LAN1 / br-lan: node-17</text><text x="916" y="623" font-size="13" fill="#496657">WRT32X · mwlwifi · wlan0-sta</text><text x="916" y="645" font-size="13" fill="#496657">Historical W/D fixture: 5 GHz / 80 MHz</text><text x="916" y="667" font-size="13" fill="#496657">MGMT WAN: node-18</text><text x="45" y="735" font-size="13" fill="#708893">MGMT eth0 · 1Gbps / full</text><text x="310" y="526" font-size="13" fill="#45623e">DUT LAN1 ↔ p43 eth0</text><text x="605" y="526" font-size="13" fill="#45623e">DUT LAN2 ↔ p42 eth0</text><text x="930" y="526" font-size="13" fill="#45623e">DUT LAN4 ↔ wrt LAN1</text><text x="1050" y="451" font-size="13" fill="#708893">DUT WAN · management</text><rect x="425" y="860" width="620" height="80" rx="10" fill="#edf0ec" stroke="#abc3a5"/><text x="441" y="889" font-size="19" font-weight="700" fill="#214636">Management switch / gateway · node-19</text><text x="441" y="916" font-size="13" fill="#496657">node-20 · dotted links terminate at dedicated management Ethernet</text><path d="M735 825V860" fill="none" stroke="#8c9fa7" stroke-width="2" stroke-dasharray="2 7"/><text x="35" y="970" font-size="13" fill="#45623e">Solid green: payload Ethernet · purple dashed: Wi-Fi / VPN · grey dotted: management. Addresses are dated snapshots; DHCP may change.</text><path d="M310 225H335V350H365" fill="none" stroke="#9373af" stroke-width="3" stroke-dasharray="8 5"/><path d="M60 300H15V825H145" fill="none" stroke="#8c9fa7" stroke-width="2" stroke-dasharray="2 7"/><rect x="30" y="100" width="280" height="200" rx="10" fill="#e9e2f1" stroke="#abc3a5"/><text x="46" y="129" font-size="19" font-weight="700" fill="#214636">m4 · NanoPi M4 Ver2.0</text><text x="46" y="155" font-size="13" fill="#496657">MGMT end0: node-21</text><text x="46" y="177" font-size="13" fill="#496657">TEST wlan0: managed Wi-Fi</text><text x="46" y="199" font-size="13" fill="#496657">brcmfmac · 2×2 VHT80</text><text x="46" y="221" font-size="13" fill="#496657">No 160 MHz support recorded</text><text x="46" y="243" font-size="13" fill="#496657">DUT hotspot client during tests</text><text x="46" y="265" font-size="13" fill="#496657">Original AP profile retained separately</text><text x="35" y="325" font-size="13" fill="#7a5896">Wi-Fi test link · AP selection varies</text></g></svg>