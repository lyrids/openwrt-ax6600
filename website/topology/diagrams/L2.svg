<svg xmlns="http://www.w3.org/2000/svg" class="topology-svg" viewBox="0 0 1200 365" role="img" aria-labelledby="L2-svg-title L2-svg-desc" style="font-family:system-ui,-apple-system,sans-serif"><title id="L2-svg-title">L2: Layer2 bridge: Ethernet and AP in the same LAN</title><desc id="L2-svg-desc">One node-26 broadcast domain. The AP and LAN1 are bridge ports; payload needs no IP routing/NAT. A is p43 and B is wrt. Arrows show both tested directions.</desc><defs><marker id="L2-wire-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#315f88" stroke-width="1.7"/></marker><marker id="L2-wire-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M9 1 L1 5 L9 9" fill="none" stroke="#315f88" stroke-width="1.7"/></marker><marker id="L2-air-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7655a2" stroke-width="1.7"/></marker><marker id="L2-air-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M9 1 L1 5 L9 9" fill="none" stroke="#7655a2" stroke-width="1.7"/></marker></defs><rect x="260" y="42" width="680" height="290" rx="14" fill="#f7f9fc" stroke="#b9c7d4"/><text x="280" y="69" text-anchor="start" font-size="16" font-weight="700" fill="#172535">DUT · one L2 bridge domain</text><text x="920" y="69" text-anchor="end" font-size="14" font-weight="700" fill="#315f88">L2</text><rect x="278" y="98" width="644" height="158" rx="9" fill="#edf4fa" stroke="#6f91b1" stroke-dasharray="5 4"/><text x="600" y="121" text-anchor="middle" font-size="14" font-weight="600" fill="#315f88">br-lan · LAN1 + built-in 5 GHz AP</text><rect x="12" y="125" width="170" height="126" rx="9" fill="#fff" stroke="#cad6e1"/><text x="97" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#172535">A · p43</text><text x="97" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#315f88">eth0</text><text x="97" y="202" text-anchor="middle" font-size="13" font-weight="400" fill="#172535">node-22</text><text x="97" y="231" text-anchor="middle" font-size="12" font-weight="400" fill="#617488">test endpoint</text><rect x="1018" y="125" width="170" height="126" rx="9" fill="#fff" stroke="#cad6e1"/><text x="1103" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#172535">B · wrt</text><text x="1103" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#315f88">wlan0-sta</text><text x="1103" y="202" text-anchor="middle" font-size="13" font-weight="400" fill="#172535">node-27</text><text x="1103" y="231" text-anchor="middle" font-size="12" font-weight="400" fill="#617488">test endpoint</text><rect x="290" y="137" width="196" height="100" rx="9" fill="#fff" stroke="#cad6e1"/><text x="388" y="161" text-anchor="middle" font-size="14" font-weight="600" fill="#172535">LAN1</text><text x="388" y="185" text-anchor="middle" font-size="13" font-weight="600" fill="#315f88">member: br-lan</text><text x="388" y="212" text-anchor="middle" font-size="13" font-weight="400" fill="#172535">untagged bridge port</text><rect x="714" y="137" width="196" height="100" rx="9" fill="#fff" stroke="#cad6e1"/><text x="812" y="161" text-anchor="middle" font-size="14" font-weight="600" fill="#172535">phy0-ap0 · 5 GHz</text><text x="812" y="185" text-anchor="middle" font-size="13" font-weight="600" fill="#315f88">member: br-lan</text><text x="812" y="212" text-anchor="middle" font-size="13" font-weight="400" fill="#172535">untagged bridge port</text><line x1="498" y1="187" x2="535" y2="187" stroke="#315f88" stroke-width="2.3" marker-start="url(#L2-wire-start)" marker-end="url(#L2-wire-end)"/><line x1="665" y1="187" x2="702" y2="187" stroke="#315f88" stroke-width="2.3" marker-start="url(#L2-wire-start)" marker-end="url(#L2-wire-end)"/><rect x="535" y="154" width="130" height="66" rx="9" fill="#dceaf6" stroke="#6f91b1"/><text x="600" y="179" text-anchor="middle" font-size="15" font-weight="700" fill="#315f88">L2 forwarding</text><text x="600" y="201" text-anchor="middle" font-size="12" font-weight="400" fill="#172535">no routing/NAT</text><line x1="186" y1="187" x2="274" y2="187" stroke="#315f88" stroke-width="2.3" marker-start="url(#L2-wire-start)" marker-end="url(#L2-wire-end)"/><text x="230.0" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#315f88">Ethernet</text><rect x="188.0" y="206" width="84" height="24" rx="5" fill="#f0f3f6" stroke="#cad6e1"/><text x="230.0" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#486071">untagged</text><line x1="926" y1="187" x2="1014" y2="187" stroke="#7655a2" stroke-width="2.3" stroke-dasharray="6 5" marker-start="url(#L2-air-start)" marker-end="url(#L2-air-end)"/><text x="970.0" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#7655a2">5 GHz / 80 MHz</text><rect x="928.0" y="206" width="84" height="24" rx="5" fill="#f0f3f6" stroke="#cad6e1"/><text x="970.0" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#486071">untagged</text><text x="280" y="283" text-anchor="start" font-size="13" font-weight="400" fill="#172535">One node-26 broadcast domain. The AP and LAN1 are bridge ports; payload needs no IP</text><text x="280" y="303" text-anchor="start" font-size="13" font-weight="400" fill="#172535">routing/NAT.</text><text x="600" y="354" text-anchor="middle" font-size="12" font-weight="400" fill="#617488">Logical configuration · hardware admission and actual CPPE/NSS packet activity are measured separately</text></svg>