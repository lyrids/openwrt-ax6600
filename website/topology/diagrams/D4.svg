<svg xmlns="http://www.w3.org/2000/svg" class="topology-svg" viewBox="0 0 1200 365" role="img" aria-labelledby="D4-svg-title D4-svg-desc" style="font-family:system-ui,-apple-system,sans-serif"><title id="D4-svg-title">D4: Dual WLAN: untagged right AP access/PVID104</title><desc id="D4-svg-desc">AP data is access/PVID104 and untagged; bridge SELF104 stays tagged and L3 remains br-dvright.104, analogous to T4. A is p43 and B is wrt. Arrows show both tested directions.</desc><defs><marker id="D4-wire-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#315f88" stroke-width="1.7"/></marker><marker id="D4-wire-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M9 1 L1 5 L9 9" fill="none" stroke="#315f88" stroke-width="1.7"/></marker><marker id="D4-air-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7655a2" stroke-width="1.7"/></marker><marker id="D4-air-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M9 1 L1 5 L9 9" fill="none" stroke="#7655a2" stroke-width="1.7"/></marker></defs><rect x="260" y="42" width="680" height="290" rx="14" fill="#f7f9fc" stroke="#b9c7d4"/><text x="280" y="69" text-anchor="start" font-size="16" font-weight="700" fill="#172535">DUT · separate L3 networks</text><text x="920" y="69" text-anchor="end" font-size="14" font-weight="700" fill="#315f88">D4</text><rect x="12" y="125" width="170" height="126" rx="9" fill="#fff" stroke="#cad6e1"/><text x="97" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#172535">A · p43</text><text x="97" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#315f88">wlan0</text><text x="97" y="202" text-anchor="middle" font-size="13" font-weight="400" fill="#172535">node-35</text><text x="97" y="231" text-anchor="middle" font-size="12" font-weight="400" fill="#617488">test endpoint</text><rect x="1018" y="125" width="170" height="126" rx="9" fill="#fff" stroke="#cad6e1"/><text x="1103" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#172535">B · wrt</text><text x="1103" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#315f88">wlan0-sta</text><text x="1103" y="202" text-anchor="middle" font-size="13" font-weight="400" fill="#172535">node-23</text><text x="1103" y="231" text-anchor="middle" font-size="12" font-weight="400" fill="#617488">test endpoint</text><rect x="278" y="98" width="220" height="158" rx="9" fill="#f1f4f7" stroke="#c6d0da"/><text x="388" y="121" text-anchor="middle" font-size="13" font-weight="600" fill="#315f88">standalone L3 attachment</text><rect x="290" y="137" width="196" height="100" rx="9" fill="#fff" stroke="#cad6e1"/><text x="388" y="161" text-anchor="middle" font-size="14" font-weight="600" fill="#172535">phy1-ap0 · 2.4 GHz</text><text x="388" y="185" text-anchor="middle" font-size="13" font-weight="600" fill="#315f88">L3: phy1-ap0</text><text x="388" y="212" text-anchor="middle" font-size="13" font-weight="400" fill="#172535">node-36</text><rect x="702" y="98" width="220" height="158" rx="9" fill="#edf4fa" stroke="#6f91b1" stroke-dasharray="5 4"/><text x="812" y="121" text-anchor="middle" font-size="13" font-weight="600" fill="#315f88">br-dvright · VLAN 104</text><rect x="714" y="137" width="196" height="100" rx="9" fill="#fff" stroke="#cad6e1"/><text x="812" y="161" text-anchor="middle" font-size="14" font-weight="600" fill="#172535">phy0-ap0 · PVID 104</text><text x="812" y="185" text-anchor="middle" font-size="13" font-weight="600" fill="#315f88">L3: br-dvright.104</text><text x="812" y="212" text-anchor="middle" font-size="13" font-weight="400" fill="#172535">node-25</text><line x1="498" y1="187" x2="535" y2="187" stroke="#315f88" stroke-width="2.3" marker-start="url(#D4-wire-start