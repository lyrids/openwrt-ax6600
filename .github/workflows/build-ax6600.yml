name: Build AX6600
run-name: AX6600 / NSS ${{ inputs.nss_firmware }}

on:
  workflow_dispatch:
    inputs:
      nss_firmware:
        description: NSS firmware files and boot default
        required: true
        type: choice
        default: dual-11.4
        options:
          - dual-11.4
          - dual-12.5
          - '11.4'
          - '12.5'

permissions:
  contents: read

concurrency:
  group: ax6600-${{ github.ref }}-${{ inputs.nss_firmware }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      artifact_name: ax6600-nss-${{ inputs.nss_firmware }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      NSS_FIRMWARE: ${{ inputs.nss_firmware }}
    steps:
      - name: Check out source
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare hosted runner
        run: |
          # Reclaim unused SDK space on this disposable GitHub-hosted runner.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools rsync swig unzip zlib1g-dev file wget curl \
            zstd u-boot-tools
          mkdir -p ci-output
          df -h .
          test "$(df --output=avail -BG . | tail -1 | tr -dc '0-9')" -ge 25

      - name: Restore source downloads
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: dl
          key: ax6600-dl-${{ runner.os }}-${{ hashFiles('configs/ax6600.feeds.conf', 'package/firmware/nss-firmware/Makefile') }}
          restore-keys: |
            ax6600-dl-${{ runner.os }}-

      - name: Prepare public profile and pinned feeds
        run: |
          umask 022
          python3 .github/scripts/ax6600-build.py prepare "$NSS_FIRMWARE"
          ./scripts/feeds update -a 2>&1 | tee ci-output/feeds-update.log
          ./scripts/feeds install -a 2>&1 | tee ci-output/feeds-install.log
          make defconfig 2>&1 | tee ci-output/defconfig.log
          python3 .github/scripts/ax6600-build.py check-config "$NSS_FIRMWARE"

      - name: Download sources
        run: |
          umask 022
          make -j8 download 2>&1 | tee ci-output/download.log

      - name: Build firmware
        run: |
          umask 022
          make -j"$(nproc)" V=s 2>&1 | tee ci-output/build.log

      - name: Verify and collect images
        run: |
          python3 .github/scripts/ax6600-build.py collect "$NSS_FIRMWARE"
          {
            echo "### AX6600 firmware"
            echo "NSS selection: `$NSS_FIRMWARE`"
            echo "Source: `$(git rev-parse HEAD)`"
            echo 'Both final image formats passed firmware/default-selection checks.'
            echo 'Build artifacts are public development images; no hardware qualification is implied.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified images
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ax6600-nss-${{ inputs.nss_firmware }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-output/firmware/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build records
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ax6600-build-records-${{ inputs.nss_firmware }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-output/*.log
            ci-output/*.json
            ci-output/config.*
            ci-output/feeds.conf
            ci-output/toolchain.txt
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish public trial images
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified firmware
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: firmware

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          NSS_FIRMWARE: ${{ inputs.nss_firmware }}
        run: |
          cd firmware
          sha256sum --check SHA256SUMS
          tag="ax6600-nss-${NSS_FIRMWARE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "AX6600 trial / NSS ${NSS_FIRMWARE} / ${GITHUB_SHA:0:10}" \
            --notes-file RELEASE-NOTES.md \
            ./*
          echo "Public trial release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
