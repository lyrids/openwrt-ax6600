">I/O controllers</text><text x="341" y="382" font-size="12" fill="#e6f2df">SDHC · USB · other peripherals</text><text x="341" y="402" font-size="12" fill="#e6f2df">Controllers connect to SoC fabric</text><rect x="625" y="330" width="270" height="90" rx="9" fill="#284c55" stroke="#668c99"/><text x="641" y="358" font-size="17" font-weight="700" fill="#e6f2df">PCIe root complex</text><text x="641" y="382" font-size="12" fill="#e6f2df">pcie0 → external Wi-Fi endpoint</text><text x="641" y="402" font-size="12" fill="#e6f2df">ath11k_pci</text><rect x="325" y="462" width="570" height="200" rx="9" fill="#315c43" stroke="#64855c"/><text x="341" y="490" font-size="17" font-weight="700" fill="#e6f2df">Integrated Wi-Fi subsystem · ath11k_ahb</text><text x="341" y="514" font-size="12" fill="#e6f2df">AHB / platform device · integrated digital Wi-Fi path</text><rect x="345" y="538" width="245" height="88" rx="9" fill="#e6eddf" stroke="#adc3a6"/><text x="361" y="566" font-size="17" font-weight="700" fill="#214333">Radio A · 2.4 GHz</text><text x="361" y="590" font-size="12" fill="#214333">Recorded Linux radio: phy1</text><text x="361" y="610" font-size="12" fill="#214333">Separate 2.4 GHz RF chain</text><rect x="625" y="538" width="245" height="88" rx="9" fill="#e6eddf" stroke="#adc3a6"/><text x="641" y="566" font-size="17" font-weight="700" fill="#214333">Radio B · 5 GHz #1</text><text x="641" y="590" font-size="12" fill="#214333">Recorded Linux radio: phy0</text><text x="641" y="610" font-size="12" fill="#214333">Lab AP at 80 MHz</text><rect x="325" y="700" width="300" height="65" rx="9" fill="#315c43" stroke="#64855c"/><text x="341" y="728" font-size="17" font-weight="700" fill="#e6f2df">UNIPHY0 / LAN data</text><text x="341" y="752" font-size="12" fill="#e6f2df">PSGMII toward LAN PHY package</text><rect x="670" y="700" width="225" height="65" rx="9" fill="#315c43" stroke="#64855c"/><text x="686" y="728" font-size="17" font-weight="700" fill="#e6f2df">UNIPHY1 / WAN data</text><text x="686" y="752" font-size="12" fill="#e6f2df">2500BASE-X toward WAN PHY</text><rect x="1005" y="300" width="360" height="140" rx="9" fill="#e8e1f0" stroke="#b8a1cf"/><text x="1021" y="328" font-size="17" font-weight="700" fill="#214333">Discrete Wi-Fi · 5 GHz #2</text><text x="1021" y="352" font-size="12" fill="#214333">QCN9074 driver family · phy2</text><text x="1021" y="372" font-size="12" fill="#214333">PCIe endpoint: 17cb:1104</text><text x="1021" y="392" font-size="12" fill="#214333">Own MAC/baseband + RF chain</text><text x="1021" y="412" font-size="12" fill="#214333">Recorded QCN station/AP: HE160</text><text x="956" y="365" font-size="12" fill="#3c7895">PCIe</text><rect x="1005" y="490" width="360" height="80" rx="9" fill="#ece6f3" stroke="#b8a1cf"/><text x="1021" y="518" font-size="17" font-weight="700" fill="#214333">2.4 GHz RF / antenna path</text><text x="1021" y="542" font-size="12" fill="#214333">Companion RF / front-end / antennas</text><rect x="1005" y="596" width="360" height="80" rx="9" fill="#ece6f3" stroke="#b8a1cf"/><text x="1021" y="624" font-size="17" font-weight="700" fill="#214333">Integrated 5 GHz RF / antenna path</text><text x="1021" y="648" font-size="12" fill="#214333">Companion RF / front-end / antennas</text><text x="1017" y="464" font-size="12" fill="#7c619b">Discrete 5 GHz has its own RF / antenna path</text><rect x="735" y="795" width="220" height="82" rx="9" fill="#e4eddd" stroke="#adc3a6"/><text x="751" y="823" font-size="17" font-weight="700" fill="#214333">QCA8075 PHY package</text><text x="751" y="847" font-size="12" fill="#214333">PSGMII → LAN1–LAN4</text><text x="751" y="867" font-size="12" fill="#214333">Four connected 1 GbE PHYs</text><rect x="1005" y="795" width="360" height="82" rx="9" fill="#e4eddd" stroke="#adc3a6"/><text x="1021" y="823" font-size="17" font-weight="700" fill="#214333">QCA8081 WAN PHY</text><text x="1021" y="847" font-size="12" fill="#214333">2500BASE-X → 2.5 GbE WAN</text><text x="1021" y="867" font-size="12" fill="#214333">MDIO address 12</text><text x="35" y="835" font-size="13" fill="#51704f">MDIO: management/control bus to PHYs</text><text x="35" y="856" font-size="12" fill="#51704f">QCA8075 addresses 24–27; QCA8081 address 12</text><text x="35" y="905" font-size="12" fill="#51704f">Blue: PCIe / Ethernet data links · green: memory / I/O / internal connections · purple: radio / RF relationships</text><text x="35" y="926" font-size="12" fill="#51704f">Bus-level synthesis from OpenWrt DTS + lab radio identity. Not a PCB netlist; RF companion part markings and PCIe link rate are not asserted.</text></g></svg>