<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 940" role="img" aria-labelledby="t d"><title id="t">AX6600 chipset and bus topology</title><desc id="d">IPQ6010 contains CPU, memory and I/O controllers, integrated Wi-Fi and Ethernet engines. Its integrated Wi-Fi has separate 2.4 and 5 GHz radio paths. A second 5 GHz radio is a discrete QCN9074-family PCIe endpoint. Ethernet connects via PSGMII to QCA8075 LAN PHYs and via 2500BASE-X to QCA8081 WAN PHY; MDIO is control only.</desc><rect width="1400" height="940" rx="14" fill="#f5f8ef"/><g font-family="system-ui,sans-serif"><text x="35" y="38" font-size="24" fill="#214333">JDCloud RE-CS-02 / AX6600 · chipset and bus topology</text><text x="35" y="64" font-size="14" fill="#51704f">Functional / device-tree view · physical bus links shown separately from software acceleration</text><rect x="300" y="95" width="650" height="695" rx="9" fill="#163d30" stroke="#163d30"/><text x="316" y="123" font-size="17" font-weight="700" fill="#e3f4d6">Qualcomm IPQ6010 · system on chip</text><path d="M300 220H245" fill="none" stroke="#648b64" stroke-width="3" stroke-dasharray=""/><path d="M300 357H245" fill="none" stroke="#648b64" stroke-width="3" stroke-dasharray=""/><path d="M325 390H270V493H245" fill="none" stroke="#648b64" stroke-width="3" stroke-dasharray=""/><path d="M345 290H895" fill="none" stroke="#8dac8a" stroke-width="3" stroke-dasharray=""/><path d="M440 250V290M730 250V290M440 290V330M730 290V330M440 420V462M730 420V462" fill="none" stroke="#8dac8a" stroke-width="3" stroke-dasharray=""/><path d="M895 528H1005" fill="none" stroke="#9378b4" stroke-width="3" stroke-dasharray=""/><path d="M895 620H1005" fill="none" stroke="#9378b4" stroke-width="3" stroke-dasharray=""/><path d="M895 376H1005" fill="none" stroke="#4d8aa7" stroke-width="3" stroke-dasharray=""/><path d="M470 765V850H735" fill="none" stroke="#4d8aa7" stroke-width="3" stroke-dasharray=""/><path d="M895 740H975V833H1005" fill="none" stroke="#4d8aa7" stroke-widt