<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
<title id="title">Test design and possible forwarding paths</title><desc id="desc">T tests are wired to wired; W tests are wired to Wi-Fi; D tests are Wi-Fi to Wi-Fi. Each topology is crossed with routing or NAT, transport, initiator and mode. Linux CPU slow path, software flowtable, CPPE and NSS are alternative or mixed paths depending on eligibility, with Wi-Fi NSS transport enabled for all modes. Measurement checks actual ownership separately.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#668978"/></marker></defs>
<rect width="1120" height="700" rx="14" fill="#f5f8f1"/><g font-family="system-ui,sans-serif" fill="#183d32">
<text x="32" y="45" font-size="21" font-weight="700">01  Choose a topology</text><text x="32" y="73" font-size="14" fill="#526e60">Same questions, different ingress and egress</text>
<g font-size="16" font-weight="700"><rect x="30" y="94" width="325" height="70" rx="8" fill="#e1ebdf"/><text x="48" y="122">T0–T4  ·  wired ↔ wired</text><text x="48" y="145" font-size="12" font-weight="400">Native, tagged, standalone &amp; bridge VLAN</text><rect x="398" y="94" width="325" height="70" rx="8" fill="#e1ebdf"/><text x="416" y="122">W0–W4  ·  wired ↔ Wi-Fi</text><text x="416" y="145" font-size="12" font-weight="400">Ethernet and built-in 5 GHz AP</text><rect x="766" y="94" width="325" height="70" rx="8" fill="#e1ebdf"/><text x="784" y="122">D0–D4  ·  Wi-Fi ↔ Wi-Fi</text><text x="784" y="145" font-size="12" font-weight="400">2.4 GHz AP and built-in 5 GHz AP</text></g>
<text x="32" y="207" font-size="21" font-weight="700">02  Vary the case</text><text x="32" y="237" font-size="14">Route / SNAT / DNAT / combined NAT   ×   TCP / UDP   ×   initiator A / B   ×   flow-offload mode</text>
<rect x="30" y="255" width="1060" height="74" rx="8" fill="#173e33"/><text x="50" y="284" font-size="15" font-weight="700" fill="#d8f6a7">0/0  Linux IP forwarding</text><text x="365" y="284" font-size="15" font-weight="700" fill="#d8f6a7">1/0  software flowtable</text><text x="704" y="284" font-size="15" font-weight="700" fill="#d8f6a7">1/1  hardware offload requested</text><text x="50" y="311" font-size="13" fill="#e4eee2">Wi-Fi NSS transport remains enabled in all three modes; Ethernet-only NSS backend is off.</text>
<text x="32" y="376" font-size="21" font-weight="700">03  Observe the actual path</text><text x="32" y="401" font-size="14" fill="#526e60">Arrows are possible relationships, not proof that every flow uses every block.</text>
<g stroke="#668978" stroke-width="2" marker-end="url(#arrow)"><line x1="223" y1="487" x2="292" y2="487"/><line x1="497" y1="470" x2="576" y2="453"/><line x1="497" y1="502" x2="576" y2="531"/><line x1="783" y1="453" x2="866" y2="487"/><line x1="783" y1="531" x2="866" y2="497"/></g>
<g font-size="15" font-weight="700"><rect x="30" y="453" width="192" height="70" rx="8" fill="#e5eadc"/><text x="48" y="482">Ingress</text><text x="48" y="505" font-size="12" font-weight="400">Ethernet or Wi-Fi</text><rect x="293" y="440" width="205" height="95" rx="8" fill="#dbece4"/><text x="311" y="468">CPU / Linux stack</text><text x="311" y="490" font-size="12" font-weight="400">routing, conntrack / NAT</text><text x="311" y="511" font-size="12" font-weight="400">software flowtable</text><rect x="577" y="420" width="205" height="70" rx="8" fill="#e8efd1"/><text x="595" y="449">CPPE</text><text x="595" y="471" font-size="12" font-weight="400">eligible Ethernet flow</text><rect x="577" y="501" width="205" height="70" rx="8" fill="#e7e2f1"/><text x="595" y="530">NSS + ath11k</text><text x="595" y="553" font-size="12" font-weight="400">Wi-Fi transport / flows</text><rect x="866" y="453" width="225" height="70" rx="8" fill="#e5eadc"/><text x="884" y="482">Egress</text><text x="884" y="505" font-size="12" font-weight="400">Ethernet or Wi-Fi</text></g>
<text x="32" y="624" font-size="17" font-weight="700">04  Separate evidence from intent</text><text x="32" y="650" font-size="13">Capture tuples and tags · installed CPPE/NSS rules and per-direction deltas · CPU · receiver loss / retransmits</text><text x="32" y="674" font-size="13">L2 bridge control is separate; D payload has no switch-port ingress. Admission varies by layout and direction.</text></g></svg>
